services:
  - type: web
    name: taskflow-backend
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production

databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow_user
    plan: free
